[project]
name = "codelabgen"
version = "0.1.0"
description = "Deterministic helpers for the codelabgen Claude Code plugin"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
codelabgen = "codelabgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
