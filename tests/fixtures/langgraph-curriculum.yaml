# Hand-written M1 curriculum: three LangGraph lessons that need no LLM key.
title: "LangGraph на практике"
description: >-
  Курс о построении графов состояний на LangGraph: от первого графа до
  маршрутизации и сохранения состояния в Postgres.
modules:
  - id: "1"
    title: Основы LangGraph
    slug: basics
    summary: Граф состояний, узлы и рёбра, условная маршрутизация и сохранение состояния.
    children:
      - id: "1.1"
        title: "Первый граф: состояние, узлы и рёбра"
        slug: hello-graph
        summary: >-
          Строим граф-калькулятор: состояние как TypedDict, узлы как функции,
          рёбра задают порядок выполнения.
        objectives:
          - Описать состояние графа через TypedDict и понять, как узлы его обновляют
          - Собрать StateGraph из узлов и рёбер, скомпилировать и вызвать его
          - Понять роль START и END
        example:
          name: calculator
          mode: new
      - id: "1.2"
        title: Условные рёбра и маршрутизация
        slug: routing
        summary: >-
          Распределяем обращения в техподдержку по очередям с помощью условных
          рёбер и простых правил вместо LLM.
        objectives:
          - Добавить условное ребро и функцию маршрутизации
          - Понять, как reducer объединяет обновления состояния
          - Проследить путь обращения по графу через stream
        prerequisites: ["1.1"]
        example:
          name: ticket-router
          mode: new
      - id: "1.3"
        title: "Сохранение состояния: checkpointer на Postgres"
        slug: persistence
        summary: >-
          Подключаем PostgresSaver к маршрутизатору обращений: состояние
          переживает перезапуск, а thread_id разделяет диалоги.
        objectives:
          - Подключить checkpointer и понять, что сохраняется после каждого шага
          - Использовать thread_id, чтобы продолжить работу с тем же обращением
          - Посмотреть историю состояний через get_state_history
        prerequisites: ["1.2"]
        example:
          name: ticket-router
          mode: extend
          from: "1.2"
        services: [postgres]
